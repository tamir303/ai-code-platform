name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run. Never cancel on
# main: the e2e job builds a large cache that later runs depend on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # Fast tier: no external services, enforces the 100% coverage claim in TESTS.md
  # ---------------------------------------------------------------------------
  test:
    name: Unit & integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit + integration tests
        # e2e is excluded on purpose: it requires the live vLLM/LiteLLM stack and
        # fails loudly without it. It runs in the e2e job below.
        run: |
          pytest tests/unit tests/integration \
            --cov=src --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=100 -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Real inference tier: builds CPU vLLM, serves Qwen2.5-Coder, runs everything
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E against real vLLM + LiteLLM
    # Skipped on pull_request: the vLLM CPU image is built from source and this
    # job costs the better part of an hour. Run it manually on a PR via
    # workflow_dispatch when a change touches inference.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The vLLM CPU image is ~4.2GB and its build pulls torch on top of that;
        # a stock runner does not have room without this.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Write test environment
        # .env.test in the repo must not contain real credentials. The HF token
        # comes from a secret; shell env wins over --env-file in Compose, so the
        # value here overrides whatever the committed file holds.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — model download will be" \
                 "unauthenticated and may be rate limited by Hugging Face."
          fi
          echo "HF_TOKEN=$HF_TOKEN" >> "$GITHUB_ENV"
          echo "LITELLM_MASTER_KEY=sk-ci-master-key" >> "$GITHUB_ENV"

      - name: Run full suite against the live stack
        run: |
          docker compose --env-file .env.test -f docker-compose.test.yaml \
            up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yaml logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # CD: publish the application image once both tiers are green
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =============================================================================
# Nginx — Production Configuration (Real SSL Certificates)
# =============================================================================
# Routing:
#   /api/v1/*       → FastAPI Backend      (chat, sessions, tasks, history)
#   /v1/*           → LiteLLM Proxy        (OpenAI API for Continue.dev & IDEs)
#   /grafana/*      → Grafana Dashboard    (observability)
#   /health         → Backend Health Check
#   /docs, /redoc   → FastAPI Swagger / ReDoc
#   /metrics        → Prometheus Metrics
# =============================================================================

upstream backend {
    server backend:8080;
}

upstream litellm {
    server litellm:4000;
}

upstream grafana {
    server grafana:3000;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name ${NGINX_HOST};
    return 301 https://$host$request_uri;
}

# --- Main HTTPS server ---
server {
    listen 443 ssl http2;
    server_name ${NGINX_HOST};

    # --- SSL (production certificates) ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Security headers ---
    add_header X-Frame-Options       SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- General proxy settings ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 50m;

    # =========================================================================
    # FastAPI Backend — /api/v1/*
    # =========================================================================
    location /api/v1/ {
        proxy_pass http://backend;

        # --- SSE: disable all buffering for streaming chat ---
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Long timeout for streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # =========================================================================
    # LiteLLM Proxy — /v1/* (OpenAI-compatible API for Continue.dev & IDEs)
    # =========================================================================
    location /v1/ {
        proxy_pass http://litellm/v1/;

        # --- SSE: disable buffering for streaming completions ---
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Also expose LiteLLM key management endpoints
    location /key/ {
        proxy_pass http://litellm/key/;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # Grafana — /grafana/*
    # =========================================================================
    location /grafana/ {
        proxy_pass http://grafana/;

        # WebSocket support for Grafana Live
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    location /grafana/api/ {
        proxy_pass http://grafana/api/;
    }

    # =========================================================================
    # Health Check — /health
    # =========================================================================
    location /health {
        proxy_pass http://backend/health;
    }

    # =========================================================================
    # Swagger / ReDoc — /docs, /redoc, /openapi.json
    # =========================================================================
    location /docs {
        proxy_pass http://backend/docs;
    }

    location /redoc {
        proxy_pass http://backend/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
    }

    # =========================================================================
    # Prometheus Metrics — /metrics
    # =========================================================================
    location /metrics {
        proxy_pass http://backend/metrics;
        # Optionally restrict to internal network in production:
        # allow 10.0.0.0/8;
        # deny all;
    }

    # --- Default: 404 ---
    location / {
        return 404 '{"detail": "Not found. See /docs for API reference."}';
        add_header Content-Type application/json;
    }
}
